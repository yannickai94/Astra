<style>
:root{--l:#fffdf5;--m:#cfe0ff;--s:#3f6fd1;--d:#1b1b3a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#14214d;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
canvas{position:absolute;image-rendering:pixelated}
#ow{left:0;top:0;width:100%;height:100%;display:none}
.ov #ow{display:block}
#ec{right:8%;top:5%;width:32%}
#pc{left:9%;bottom:36%;width:38%;transform:scaleX(-1)}
.bl{animation:bl .15s steps(1) 4}
@keyframes bl{50%{opacity:0}}
.hp{position:absolute;width:54%;border:.8cqw solid var(--d);border-radius:2cqw;background:var(--l);padding:1.6cqw 2.2cqw;font-size:3.4cqw;line-height:1.5}
#eb{left:3%;top:4%}#pb{right:3%;top:50%}
.bar{height:2.6cqw;border:.5cqw solid var(--d);margin-top:1.2cqw;background:var(--l)}
.bar i{display:block;height:100%;width:100%;transition:width .6s}
#pt{text-align:right;margin-top:1cqw}
#tx{position:absolute;left:0;right:0;bottom:0;height:34%;font-size:4.4cqw;background:var(--l);border-top:1cqw solid var(--d);padding:3cqw;line-height:1.7}
.mo #tx{right:56%}
.ov:not(.sp) #tx{display:none}
#mn{position:absolute;right:0;bottom:0;width:56%;height:34%;display:none;grid-template-columns:1fr 1fr;background:var(--l);border:1cqw solid var(--d)}
#mn button{font:inherit;font-size:3.2cqw;color:var(--d);background:none;border:0;text-align:left;padding:1cqw 1.5cqw;cursor:pointer}
#mn button:hover,#mn button:active{background:var(--m)}
#mn{overflow-y:auto;align-content:start}
#pk{position:absolute;top:8%;left:0;right:0;display:none;justify-content:space-around}
#pk canvas{position:static;width:27%}
.pick #pk{display:flex}
.pick #eb,.pick #pb,.pick #ec,.pick #pc,.ov #eb,.ov #pb,.ov #ec,.ov #pc{display:none}
#dx{position:absolute;inset:0;background:var(--l);display:none;padding:2cqw 3cqw;font-size:2.7cqw;z-index:5;line-height:1.4;overflow:auto}
.dr{display:flex;gap:2.5cqw;align-items:center;border-bottom:.4cqw solid var(--m);height:15.3cqw;overflow:hidden}
.dr canvas{position:static;width:12cqw;height:12cqw;flex:none}
.dr small{font-size:2cqw;line-height:1.5}
#tx.wt::after{content:'▼';position:absolute;right:3cqw;bottom:2cqw;font-size:3.4cqw;color:#e53935;animation:bk .7s steps(1) infinite}
@keyframes bk{50%{opacity:0}}@keyframes hop{50%{transform:translateY(-3cqw)}}
#ti{position:absolute;inset:0;z-index:6;background:linear-gradient(#0d1b4d,#2f56c4 52%,#8bd36e 52%,#4f9f3f);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:6cqw 4cqw 4cqw;text-align:center;cursor:pointer;color:#fff}
#ti .lg b{display:block;font-size:10cqw;line-height:1.25;text-shadow:.7cqw .7cqw 0 #1b1b3a}
#ti .lg b:nth-child(1){color:#ffd600}#ti .lg b:nth-child(2){color:#ff5252}#ti .lg b:nth-child(3){color:#82b1ff}
#ti .rw{display:flex;justify-content:space-around;width:100%}
#ti .rw canvas{position:static;width:24cqw;animation:hop 1.2s ease-in-out infinite}#ti .rw canvas:nth-child(2){animation-delay:.2s}#ti .rw canvas:nth-child(3){animation-delay:.4s}
#ti .pr{font-size:3.6cqw;animation:bk 1s steps(1) infinite}#ti small{font-size:2.6cqw;opacity:.8}
body{display:flex;align-items:center;justify-content:center;background:#0d1b4d;padding:0}
#gb{width:min(100vw,520px);height:100dvh;display:flex;flex-direction:column;background:#0d1b4d;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;color:#e8eeff}
#st{flex:1;line-height:1.6;font-size:clamp(7px,2.2vw,10px)}
#hud button{height:44px;min-width:66px;border:0;border-radius:14px;font:inherit;font-size:11px;color:#fff;touch-action:manipulation;box-shadow:0 3px 0 #0006}
#hud button:active{transform:translateY(3px);box-shadow:none}
#mb{background:#e53935}#db{background:#1e88e5}
#sc{flex:1;min-height:0;position:relative;container-type:inline-size;overflow:hidden}
#in{position:absolute;inset:0;font-size:4cqw;color:var(--d);background:linear-gradient(#4f9f3f,#3f8a33);touch-action:none}
#bs{position:absolute;left:0;top:0;width:100%;aspect-ratio:10/9;overflow:hidden;background:radial-gradient(ellipse 18% 3.5% at 76% 41%,#3d7f31 99%,transparent),radial-gradient(ellipse 26% 4.5% at 28% 69%,#3d7f31 99%,transparent),linear-gradient(#8fd3ff,#e3f5ff 44%,#8bd36e 44%,#4f9f3f)}
.ov #bs{display:none}
#tx,#mn{height:36cqw!important}
